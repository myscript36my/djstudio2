plugins {
    id 'com.android.application'
}

android {
    namespace 'com.djstudio2.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.djstudio2.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
