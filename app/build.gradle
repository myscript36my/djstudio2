plugins {
    id 'com.android.application'
}

android {
    namespace 'com.djstudio2.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.djstudio2.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
